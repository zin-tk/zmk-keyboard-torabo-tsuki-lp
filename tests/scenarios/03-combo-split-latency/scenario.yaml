name: 転送遅延でコンボが崩れる
description: |
  02 と全く同じ指の動きだが、ペリフェラル(左)側の入力が 60ms 遅れて
  セントラルに届く状況。コンボの判定時間(既定 50ms)を超えるため
  mouse_R は成立せず、Y と T が別々に打鍵されたことになる。

  実機の BLE 分割では通常 10ms 前後の遅延だが、
  接続が不安定なときに起きる「取りこぼし」を意図的に再現している。

  注: Tier B (./tests/run-split.sh) では遅延を注入せず実際の BLE 通信に任せるため、
  接続が正常ならコンボは成立する。両者の期待値が違うのはそのため。
peripheral_latency_ms: 60
steps:
  - {at: 0,  press: 17}  # 左: T
  - {at: 8,  press: 18}  # 右: Y
  - {at: 80, release: 17}
  - {at: 88, release: 18}
