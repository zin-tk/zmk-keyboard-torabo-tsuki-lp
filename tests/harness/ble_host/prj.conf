# ホスト役(PC/スマホ相当)の最小構成。
# キーボード側と違い ZMK は一切使わず、Zephyr の BLE セントラルだけで動く。

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
# CCC のハンドルを探すのを Zephyr に任せる (main.c の subscribe_next が前提にしている)
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_DEVICE_NAME="tier-b-host"

# ZMK 側が CONFIG_BT_SMP_SC_PAIR_ONLY=y なので、LE Secure Connections が要る
# (BT_SMP を有効にすれば既定で付いてくる)。
CONFIG_BT_SMP=y

# 相手はキーボード 1 台だけ。
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# ボンドを NVS に残す。run_split_tests.sh が -flash=<file> でフラッシュの
# 中身をファイルに置くので、再起動シナリオ(--reboot)では前回のボンドが残る。
# 実機のホスト(PC)もキーボードを一度ペアリングすれば覚えているので、
# この方が実機に近い。
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_BT_SETTINGS=y
# GATT の探索・購読をワークキューから回すので余裕を持たせる。
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_LOG=y
