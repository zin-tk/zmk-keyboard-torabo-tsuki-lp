# ホスト役(PC/スマホ相当)の最小構成。
# キーボード側と違い ZMK は一切使わず、Zephyr の BLE セントラルだけで動く。

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="tier-b-host"

# ZMK 側が CONFIG_BT_SMP_SC_PAIR_ONLY=y なので、LE Secure Connections が要る
# (BT_SMP を有効にすれば既定で付いてくる)。
CONFIG_BT_SMP=y

# 相手はキーボード 1 台だけ。
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# ボンドは 1 回のシミュレーション内でしか使わないので永続化しない。
# (NVS に残った状態を再現したくなったら、キーボード側と同じ settings 一式を足す)

CONFIG_LOG=y
