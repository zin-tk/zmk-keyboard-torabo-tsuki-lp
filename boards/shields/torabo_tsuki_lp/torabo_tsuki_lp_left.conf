CONFIG_ZMK_STUDIO=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER=y
CONFIG_ZMK_STATUS_LED=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000
CONFIG_ZMK_NON_LIPO_MIN_MV=1000
CONFIG_ZMK_NON_LIPO_LOW_MV=900

# Disable battery history RPC on peripheral (handler runs on central only)
# CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC is not set

# ---------------------------------------------------------------------------
# DYA Studio (https://studio.dya.cormoran.works)
#   開発者ガイド: https://dya-studio-dev.cormoran707.workers.dev/developer-guide
#   ここは左右どちらのビルドにも効く設定のみ。
#   セントラル専用の RPC ハンドラは snippets/split-central/split-central.conf
# ---------------------------------------------------------------------------

# BLE プロファイル 4 本 + 分割ペリフェラル 1 本
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# 各モジュールの設定永続化バックエンド。
# SPLIT_RPC_RELAY により、セントラル経由でペリフェラル側の設定も読み書きできる
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# 再起動要因の記録 (Troubleshooting タブ)。
# 両半身で有効にするとセントラル経由でペリフェラル側の記録も取得できる
CONFIG_ZMK_WATCHDOG=y

# --- Custom Studio Protocol を複数使う場合の推奨値 (開発者ガイド レベル2) ---
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
