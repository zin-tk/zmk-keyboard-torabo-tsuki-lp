manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: sekigon-gonnoc
      url-base: https://github.com/sekigon-gonnoc
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    # ZMK v0.4 (Zephyr 4.1) + DYA Studio の Custom Studio Protocol 一式。
    # main+custom-studio-protocol に fast-keymap / activity(idle,sleep の実行時変更) /
    # battery threshold / wired transport を足した統合ブランチ。
    # https://github.com/cormoran/zmk/wiki/Available-Custom-Studio-RPC-aware-Branches
    - name: zmk
      remote: cormoran
      revision: main+dya
      import:
        file: app/west.yml

    # --- ボード / ドライバ (torabo-tsuki LP 固有) ---
    - name: zmk-component-bmp-boost
      remote: sekigon-gonnoc
      import: west.yml
      # master は Zephyr HWMv2 (board.yml) 形式。v0.2 は旧形式で v0.4 ではビルドできない
      revision: master
    - name: zmk-feature-status-led
      remote: sekigon-gonnoc
      revision: main
    - name: zmk-driver-paw3222
      remote: sekigon-gonnoc
      revision: torabo-tsuki
    - name: zmk-driver-iqs7211e
      remote: sekigon-gonnoc
    - name: zmk-feature-cdc-acm-bootloader-trigger
      remote: sekigon-gonnoc
      revision: main
    - name: zmk-feature-non-lipo-battery-management
      remote: sekigon-gonnoc
      revision: main

    # --- DYA Studio: コア (他モジュールの依存先) ---
    # 設定の永続化バックエンド。runtime-macro/combo/input-processor が依存する
    - name: zmk-feature-custom-settings
      remote: cormoran
      revision: main
    # キーマップ読み込みの高速化と差分表示
    - name: zmk-feature-fast-keymap
      remote: cormoran
      revision: main

    # --- DYA Studio: Keymap / Macro / Combo タブ ---
    - name: zmk-feature-runtime-macro
      remote: cormoran
      revision: main
    - name: zmk-feature-runtime-combo
      remote: cormoran
      revision: main
    # 押下キーのリアルタイム表示
    - name: zmk-feature-input-stream
      remote: cormoran
      revision: main
    # プレビューにトラックボール/ロータリーエンコーダを描画する
    - name: zmk-feature-module-physical-layout
      remote: cormoran
      revision: main
    # エンコーダの回転割り当てをレイヤーごとに Web から変更する
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: main

    # --- DYA Studio: Trackball タブ ---
    # ポインタ感度 / 回転 / スクロール / 軸スナップ / 自動レイヤー切替。
    # センサードライバに依存しないため PAW3222 でも動作する
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: main

    # --- DYA Studio: Connection タブ ---
    - name: zmk-module-ble-management
      remote: cormoran
      revision: main

    # --- DYA Studio: Settings タブ ---
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main

    # --- DYA Studio: Troubleshooting タブ ---
    - name: zmk-feature-device-info
      remote: cormoran
      revision: main
    - name: zmk-feature-watchdog
      remote: cormoran
      revision: main
    - name: zmk-module-battery-history
      remote: cormoran
      revision: main
      path: src/battery_history
  self:
    path: config
