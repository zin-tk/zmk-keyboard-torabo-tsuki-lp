CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# ---------------------------------------------------------------------------
# DYA Studio: セントラル側でだけ動く RPC ハンドラ群。
# キーマップの処理 (behaviors / combos / sensor-bindings) は ZMK では
# セントラルでのみコンパイルされるため、これらもセントラル専用でよい。
# ---------------------------------------------------------------------------

# 分割リレー実行時のスタック不足対策 (開発者ガイド推奨値)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768

# --- ロック ---
# ZMK Studio の既定のロックを無効にし、常にアンロック状態で起動する。
# &studio_unlock を押さなくても USB / BLE から編集できる
CONFIG_ZMK_STUDIO_LOCKING=n
# ロック無効時はこの既定値が n になるが、BLE 接続には必要なので明示的に有効化する。
# &studio_unlock は「ダイレクトアドバタイジングを出して Web Bluetooth から
# 見つけられるようにする」キーとして残る
CONFIG_ZMK_STUDIO_LOCK_BLE_DIRECT_ADVERTISING_ON_UNLOCK=y

# --- Keymap タブ ---
# キーマップ読み込みの高速化と、初期キーマップとの差分表示
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y
# 押下キーのリアルタイム表示
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y
# プレビューにトラックボール / ロータリーエンコーダを描画する
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=y

# --- Macro / Combo タブ ---
# &rmacro <slot> はキーマップに書かなくても DYA Studio の
# ビヘイビア一覧から任意のキーに割り当てられる。COUNT は同時に
# 存在できるマクロの最大数
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_MACRO_COUNT=8
# runtime macro / combo はビヘイビアをローカル ID で永続化する
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
# 既定コンボは keymap.keymap の runtime_combo_defaults ノードで定義する
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=16

# --- Trackball タブ ---
# 感度 / 回転 / スクロール / 軸スナップ / 自動レイヤー切替。
# PAW3222 のようなドライバ側 RPC を持たないセンサーでも動作する
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
# processor-label の上限 (NUL 込み)。既定の 8 では
# 両トラボ構成の "mouse-left" / "scroll-left" が BUILD_ASSERT に引っかかる
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_NAME_MAX_LEN=12

# --- Connection タブ ---
# ホスト側 BLE プロファイルの管理なので、分割ではセントラルだけでよい
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# --- Settings タブ ---
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y

# --- Troubleshooting タブ ---
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
