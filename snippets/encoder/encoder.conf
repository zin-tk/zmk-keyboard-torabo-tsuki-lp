# ロータリーエンコーダ (EC11 互換) 共通設定。
# 実際のピン割り当ては encoder-left スニペットで上書きする。
CONFIG_EC11=y
CONFIG_SENSOR=y

# GLOBAL_THREAD (system workqueue) では BLE / kscan と競合して
# ec11_sample_fetch が遅れ、A/B が複数状態遷移して取りこぼす。
# 専用スレッドにすると割り込みから即座にサンプリングできる。
CONFIG_EC11_TRIGGER_OWN_THREAD=y

# 回転の割り当てをレイヤーごとに DYA Studio から変更する
# (DYA Studio Keymap タブの Sensor 欄 / subsystem: cormoran_rsr)
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
